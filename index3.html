<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 3</title>
</head>
<body>
    <!-- Alt+arrows to go up and down with pasting text -->
    <form>
        <input type="text" 
        placeholder="enter your name" 
        minlength="2" 
        maxlength="6" 
        required 
        size="50"
        >
        <!-- Control+space to see all the items there is -->
        <input type="password" 
        placeholder="enter your password" 
        minlength="8" 
        maxlength="16" 
        required 
        size="50"
        >
        <br>
        <button>Send</button>
    </form>

</body>
</html>
