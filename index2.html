<!DOCTYPE html>
<html>
<body>

<h1>Clock</h1>

<p id="date">00:00:00</p>
<button id="but" OnClick=buttonDate() >Click me to start</button>

<script>
function buttonDate() {
  setInterval(displayDate,1000);
}
function displayDate() {
  let dt = new Date();
  let time = zeroChecker(dt.getHours()) + ":" + zeroChecker(dt.getMinutes()) + ":" + zeroChecker(dt.getSeconds());
  document.getElementById("date").innerHTML = time;
}
function zeroChecker(text) {
	return (text < 10 ) ? ("0" + text) : text;
}
</script>


<style>
#date {
font-size: 75px;
color: red;
padding: 50px;
border: 10px solid black;
border-radious: 25px;
background: gray;
box-shadow: 2px 10px 10px 4px gray;
transform: rotateZ(20deg)
}

 
</style>
</body>
</html>
